server {
    listen 80 default_server;
    listen 3000 default_server;
    listen 4173 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Proxy para WebSockets do Appwrite (Realtime)
    location /v1/realtime {
        proxy_pass https://bancosupa-appwrite.grtbdz.easypanel.host/v1/realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host bancosupa-appwrite.grtbdz.easypanel.host;
        proxy_ssl_server_name on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy para API REST do Appwrite (elimina bloqueio de cookies de terceiros / cross-origin)
    location /v1/ {
        proxy_pass https://bancosupa-appwrite.grtbdz.easypanel.host/v1/;
        proxy_set_header Host bancosupa-appwrite.grtbdz.easypanel.host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;

        # Reescreve o domínio dos cookies de sessão para o domínio local
        proxy_cookie_domain ~\.?bancosupa-appwrite\.grtbdz\.easypanel\.host $host;
    }

    # Suporte a SPA (Single Page Application) - evita 404 ao atualizar rotas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de ativos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
